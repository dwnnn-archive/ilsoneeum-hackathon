name: Build and deploy to Azure

on:
  push:
    branches:
      - ilsoneeum-submit
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ilsoneeumacr1105.azurecr.io
  IMAGE_NAME: ilsoneeum

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure and restart Azure App Service container
        shell: bash
        run: |
          az webapp config container set \
            --resource-group rg-ilsoneeum-hackathon \
            --name ilsoneeum-demo-2026 \
            --container-image-name "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --container-registry-url "https://${REGISTRY}" \
            --container-registry-user "${{ secrets.ACR_USERNAME }}" \
            --container-registry-password "${{ secrets.ACR_PASSWORD }}"
          az webapp restart \
            --resource-group rg-ilsoneeum-hackathon \
            --name ilsoneeum-demo-2026
